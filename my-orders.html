<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders — Campus Eats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--hunter:#1F3823;--brick:#A8412C;--parchment:#EFE9DA;--gold:#C9A227;--ink:#2B2418;--white:#fff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Work Sans',sans-serif;background:var(--parchment);color:var(--ink);min-height:100vh}
a{color:inherit;text-decoration:none}
header{background:var(--hunter);border-bottom:3px solid var(--gold);padding:15px 20px;color:var(--white)}
.nav{max-width:1000px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{font:700 22px 'Oswald',sans-serif;letter-spacing:1px}
.links{display:flex;gap:18px;flex-wrap:wrap;font:500 14px 'Oswald',sans-serif;text-transform:uppercase}
.links a:hover{color:var(--gold)}
main{max-width:900px;margin:0 auto;padding:38px 16px 70px}
.hero{text-align:center;margin-bottom:26px}
.eyebrow{display:inline-block;color:var(--brick);font:600 12px 'Oswald',sans-serif;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px}
h1{font:700 38px 'Oswald',sans-serif;color:var(--hunter)}
.subtitle{margin-top:8px;color:#645d50;line-height:1.5}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0}
button,.button{border:0;border-radius:8px;padding:11px 16px;font:600 14px 'Work Sans',sans-serif;cursor:pointer}
.primary{background:var(--brick);color:white}.secondary{background:white;border:1px solid #d8d0c0;color:var(--ink)}
.cancel-order{background:#fff;border:1px solid var(--brick);color:var(--brick)}.cancel-order:disabled{opacity:.6;cursor:wait}
#message{padding:13px 15px;background:white;border-radius:10px;margin:18px 0;text-align:center;line-height:1.5}
#orders{display:grid;gap:14px}
.order{background:white;border-radius:12px;padding:18px;border-left:5px solid var(--gold);box-shadow:0 3px 12px #2b24180c}
.order-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.order-id{font:700 18px 'Oswald',sans-serif;color:var(--hunter)}
.status{display:inline-block;border-radius:20px;padding:5px 10px;background:#f0eadb;font-size:12px;font-weight:700;text-transform:capitalize}
.status.delivered{background:#e0f3e5;color:#176534}.status.cancelled{background:#fbe4df;color:#8f271b}.status.accepted{background:#e3edf9;color:#1d4d7d}
.status-explanation{margin-top:9px;color:#5f594e;font-size:13px;line-height:1.45}
.order-instructions{margin-top:8px;padding:10px 12px;background:#f4f0e6;border-left:3px solid var(--gold);border-radius:5px;color:var(--ink);font-size:13px;line-height:1.5;overflow-wrap:anywhere}
.meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:#6c655a;font-size:13px;margin-top:12px}
.order-bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:15px;padding-top:13px;border-top:1px solid #eee8dc}
.total{font:700 19px 'Oswald',sans-serif;color:var(--brick)}
.empty{background:white;border-radius:12px;padding:28px;text-align:center;line-height:1.6}
.order-filters{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:18px 0 14px}
.order-filter{background:#fff;border:1px solid #d8d0c0;color:var(--ink);padding:9px 13px;border-radius:999px;font-size:13px}
.order-filter[aria-pressed="true"]{background:var(--hunter);border-color:var(--hunter);color:#fff}
.order-filter .count{display:inline-block;margin-left:5px;font-size:11px;opacity:.8}
#notificationToast{display:none;position:fixed;right:18px;bottom:18px;z-index:1000;max-width:min(420px,calc(100vw - 36px));padding:15px 18px;background:var(--hunter);color:white;border-left:4px solid var(--gold);border-radius:10px;box-shadow:0 8px 28px #0003;line-height:1.45}
#notificationToast.show{display:block}
.feedback-button{background:#e8f0e6;border:1px solid #b5c9b0;color:var(--hunter);font-weight:700}
.feedback-modal{display:none;position:fixed;inset:0;z-index:1200;background:#171b17b8;padding:18px;align-items:center;justify-content:center}
.feedback-modal.open{display:flex}
.feedback-panel{width:min(480px,100%);max-height:90vh;overflow:auto;background:var(--white);border-radius:16px;padding:24px;box-shadow:0 18px 60px #0005}
.feedback-panel h2{font:700 27px 'Oswald',sans-serif;color:var(--hunter);margin-bottom:6px}
.feedback-panel p{font-size:14px;color:#645d50;margin-bottom:16px}
.feedback-panel label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}
.feedback-panel select,.feedback-panel textarea{width:100%;border:1px solid #cfc8b9;border-radius:8px;padding:11px;font:inherit;background:white}
.feedback-panel textarea{min-height:100px;resize:vertical}
.feedback-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.feedback-status{min-height:20px;font-size:13px;color:var(--brick);margin-top:10px}
@media(max-width:520px){h1{font-size:32px}.order{padding:15px}.links{gap:12px}.feedback-panel{padding:18px}}
</style>
</head>
<body>
<header><div class="nav"><a class="brand" href="campuseats-menu.html">CAMPUS EATS</a><nav class="links" aria-label="Main navigation"><a href="campuseats-menu.html">Menu</a><a href="my-orders.html">Track Order</a><a href="my-orders.html" aria-current="page">My Orders</a><a href="help.html">Help</a><a href="login.html" id="accountNav">Sign In</a><a href="#" id="logoutNav" hidden>Log Out</a></nav></div></header>
<main>
<section class="hero"><span class="eyebrow">Your Campus Eats account</span><h1>My Orders</h1><p class="subtitle">See your recent orders and check their latest status.</p></section>
<div class="actions"><button class="primary" id="refreshBtn" type="button">Refresh Orders</button><button class="secondary" id="notificationBtn" type="button">Enable Notifications</button><a class="button secondary" href="campuseats-menu.html">Browse Menu</a></div>
<div id="message" role="status" aria-live="polite">Loading your orders…</div><div id="notificationToast" role="status" aria-live="polite"></div>
<div class="order-filters" id="orderFilters" aria-label="Filter orders" hidden>
<button class="order-filter" type="button" data-filter="all" aria-pressed="true">All <span class="count" data-count="all">0</span></button>
<button class="order-filter" type="button" data-filter="pending" aria-pressed="false">Pending <span class="count" data-count="pending">0</span></button>
<button class="order-filter" type="button" data-filter="accepted" aria-pressed="false">Accepted <span class="count" data-count="accepted">0</span></button>
<button class="order-filter" type="button" data-filter="delivered" aria-pressed="false">Delivered <span class="count" data-count="delivered">0</span></button>
<button class="order-filter" type="button" data-filter="cancelled" aria-pressed="false">Cancelled <span class="count" data-count="cancelled">0</span></button>
</div>
<section id="orders" aria-label="Your order history"></section>
</main>
<div class="feedback-modal" id="feedbackModal" role="dialog" aria-modal="true" aria-labelledby="feedbackTitle">
  <form class="feedback-panel" id="feedbackForm">
    <h2 id="feedbackTitle">How was your order?</h2>
    <p>Your order has been delivered. Tell us how we did so we can improve Campus Eats.</p>
    <label for="feedbackRating">Your rating</label>
    <select id="feedbackRating" required>
      <option value="">Choose a rating</option>
      <option value="5">5 — Excellent</option>
      <option value="4">4 — Good</option>
      <option value="3">3 — Okay</option>
      <option value="2">2 — Poor</option>
      <option value="1">1 — Very poor</option>
    </select>
    <label for="feedbackComment">Comments (optional)</label>
    <textarea id="feedbackComment" maxlength="1000" placeholder="Food, delivery, or ordering experience…"></textarea>
    <div class="feedback-status" id="feedbackStatus" role="status" aria-live="polite"></div>
    <div class="feedback-actions">
      <button type="button" class="secondary" id="feedbackLater">Later</button>
      <button type="submit" class="primary" id="feedbackSubmit">Send Feedback</button>
    </div>
  </form>
</div>
<script>
(function(){
  'use strict';
  const API_BASE = window.CAMPUS_EATS_API_BASE || 'https://campus-eats-api-wc8c.onrender.com';
  const token = localStorage.getItem('campusEatsToken');
  const message = document.getElementById('message');
  const ordersEl = document.getElementById('orders');
  const orderFilters = document.getElementById('orderFilters');
  let currentOrders = [];
  let activeFilter = 'all';
  const refreshBtn = document.getElementById('refreshBtn');
  const notificationBtn = document.getElementById('notificationBtn');
  const notificationToast = document.getElementById('notificationToast');
  const previousStatuses = new Map();
  let firstSuccessfulLoad = true;
  let loading = false;
  let toastTimer = null;
  let feedbackOrderId = null;
  let feedbackTrigger = null;
  const feedbackModal = document.getElementById('feedbackModal');
  const feedbackForm = document.getElementById('feedbackForm');
  const feedbackRating = document.getElementById('feedbackRating');
  const feedbackComment = document.getElementById('feedbackComment');
  const feedbackStatus = document.getElementById('feedbackStatus');
  const feedbackSubmit = document.getElementById('feedbackSubmit');
  const labels = {pending:'Pending', accepted:'Order Confirmed', delivered:'Delivered', cancelled:'Cancelled'};
  function addText(parent, tag, className, value){
    const el = document.createElement(tag);
    if(className) el.className = className;
    el.textContent = value;
    parent.appendChild(el);
    return el;
  }
  function showToast(text){
    notificationToast.textContent = text;
    notificationToast.classList.add('show');
    if(toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>notificationToast.classList.remove('show'), 6500);
  }
  function statusMessage(status){
    return ({pending:'is awaiting staff confirmation',accepted:'has been accepted by staff',delivered:'has been delivered',cancelled:'has been cancelled'})[status] || 'status changed to '+status;
  }
  function announceStatus(order, status){
    const message = 'Order #'+String(order.id).slice(0,8).toUpperCase()+' '+statusMessage(status)+'.';
    showToast(message);
    if('Notification' in window && Notification.permission === 'granted'){
      try { new Notification('Campus Eats order update', {body:message, tag:'campus-eats-'+order.id}); } catch (_) {}
    }
  }
  notificationBtn.addEventListener('click', async function(){
    if(!('Notification' in window)){
      showToast('Browser notifications are not supported here. Keep My Orders open to see on-page updates.');
      return;
    }
    if(Notification.permission === 'granted'){
      showToast('Browser notifications are already enabled.');
      return;
    }
    if(Notification.permission === 'denied'){
      showToast('Notifications are blocked in your browser settings. You can still see updates while this page is open.');
      return;
    }
    try{
      const permission = await Notification.requestPermission();
      showToast(permission === 'granted' ? 'Browser notifications enabled. We will notify you when an order status changes.' : 'Permission was not granted. On-page updates will still appear while this page is open.');
    }catch(_){
      showToast('Could not enable browser notifications. On-page updates will still appear while this page is open.');
    }
  });
  function renderOrders(orders){
    currentOrders = Array.isArray(orders) ? orders : [];
    const counts = {all:currentOrders.length, pending:0, accepted:0, delivered:0, cancelled:0};
    currentOrders.forEach(order => {
      const status = String(order.status || 'pending').toLowerCase();
      if (Object.prototype.hasOwnProperty.call(counts, status)) counts[status]++;
    });
    orderFilters.hidden = currentOrders.length === 0;
    orderFilters.querySelectorAll('[data-count]').forEach(el => { el.textContent = String(counts[el.dataset.count] || 0); });
    orderFilters.querySelectorAll('[data-filter]').forEach(button => {
      const selected = button.dataset.filter === activeFilter;
      button.setAttribute('aria-pressed', String(selected));
    });
    const visibleOrders = activeFilter === 'all' ? currentOrders : currentOrders.filter(order => String(order.status || 'pending').toLowerCase() === activeFilter);
    ordersEl.replaceChildren();
    if(currentOrders.length && visibleOrders.length === 0){
      const empty = document.createElement('div');
      empty.className = 'empty';
      addText(empty, 'h2', '', 'No ' + activeFilter + ' orders');
      addText(empty, 'p', '', 'Choose another status filter to see more of your orders.');
      ordersEl.appendChild(empty);
      return;
    }
    if(!currentOrders.length){
      const empty = document.createElement('div');
      empty.className = 'empty';
      addText(empty,'h2','', 'No orders yet');
      addText(empty,'p','', 'When you place an order, it will appear here.');
      const link = document.createElement('a');
      link.className='button primary';
      link.href='campuseats-menu.html';
      link.textContent='Explore the Menu';
      link.style.display='inline-block';
      link.style.marginTop='16px';
      empty.appendChild(link);
      ordersEl.appendChild(empty);
      return;
    }
    visibleOrders.forEach(order=>{
      const card=document.createElement('article');
      card.className='order';
      const top=document.createElement('div'); top.className='order-top';
      addText(top,'span','order-id','#'+String(order.id).slice(0,8).toUpperCase());
      const status=addText(top,'span','status '+String(order.status||'pending').toLowerCase(),labels[order.status]||order.status||'Unknown');
      card.appendChild(top);
      const statusExplanations = {
        pending: 'Waiting for staff to confirm your order.',
        accepted: 'Staff have accepted your order. It is being prepared or arranged.',
        delivered: 'This order has been marked as delivered.',
        cancelled: 'This order was cancelled and will not be prepared or delivered.'
      };
      addText(card, 'p', 'status-explanation', statusExplanations[String(order.status || 'pending').toLowerCase()] || 'Check tracking for the latest update on this order.');
      if (order.order_notes) addText(card, 'p', 'order-instructions', 'Your instructions: ' + order.order_notes);
      const meta=document.createElement('div');meta.className='meta';
      const date=order.created_at ? new Date(order.created_at).toLocaleString([], {dateStyle:'medium',timeStyle:'short'}) : 'Date unavailable';
      addText(meta,'span','',date);
      addText(meta,'span','', 'Order ID: '+String(order.id).slice(0,8).toUpperCase());
      card.appendChild(meta);
      const bottom=document.createElement('div');bottom.className='order-bottom';
      addText(bottom,'span','total','R'+(Number(order.total_cents||0)/100).toFixed(2));
      const track=document.createElement('a');
      track.className='button primary';
      track.href='order%20tracking.html?orderId='+encodeURIComponent(order.id);
      track.textContent='Track Order';
      bottom.appendChild(track);
      if(order.status==='pending'){
        const cancel=document.createElement('button');
        cancel.type='button';
        cancel.className='cancel-order';
        cancel.textContent='Cancel Order';
        cancel.addEventListener('click',()=>cancelOrder(order.id,cancel));
        bottom.appendChild(cancel);
      }
      if(order.status==='delivered'){
        if(order.feedback_submitted){
          addText(bottom,'span','', 'Feedback submitted ✓');
        } else {
          const feedbackButton=document.createElement('button');
          feedbackButton.type='button';
          feedbackButton.className='feedback-button';
          feedbackButton.textContent='Leave Feedback';
          feedbackButton.addEventListener('click',()=>openFeedback(order.id, feedbackButton));
          bottom.appendChild(feedbackButton);
        }
      }
      card.appendChild(bottom);
      ordersEl.appendChild(card);
    });
  }

  function openFeedback(orderId, trigger){
    feedbackOrderId=orderId;
    feedbackTrigger=trigger || null;
    feedbackForm.reset();
    feedbackStatus.textContent='';
    feedbackModal.classList.add('open');
    feedbackRating.focus();
  }

  function closeFeedback(){
    feedbackModal.classList.remove('open');
    feedbackOrderId=null;
    if(feedbackTrigger && document.contains(feedbackTrigger)) feedbackTrigger.focus();
    feedbackTrigger=null;
  }

  document.addEventListener('keydown', event=>{
    if(event.key==='Escape' && feedbackModal.classList.contains('open')) closeFeedback();
  });

  document.getElementById('feedbackLater').addEventListener('click',closeFeedback);
  feedbackModal.addEventListener('click',event=>{if(event.target===feedbackModal) closeFeedback();});
  feedbackForm.addEventListener('submit',async event=>{
    event.preventDefault();
    if(!feedbackOrderId) return;
    const orderId=feedbackOrderId;
    feedbackSubmit.disabled=true;
    feedbackSubmit.textContent='Sending…';
    feedbackStatus.textContent='';
    try{
      const response=await fetch(API_BASE+'/api/orders/'+encodeURIComponent(orderId)+'/feedback',{
        method:'POST',
        headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},
        body:JSON.stringify({rating:Number(feedbackRating.value),comment:feedbackComment.value.trim()})
      });
      const data=await response.json().catch(()=>({}));
      if(!response.ok) throw new Error(data.error||'Could not submit feedback.');
      showToast('Thank you! Your feedback has been received.');
      closeFeedback();
      await loadOrders(true);
    }catch(error){
      feedbackStatus.textContent=error.message||'Could not submit feedback. Please try again.';
    }finally{
      feedbackSubmit.disabled=false;
      feedbackSubmit.textContent='Send Feedback';
    }
  });
  async function cancelOrder(orderId, button){
    if(!window.confirm('Cancel this order? This cannot be undone.')) return;
    button.disabled=true;
    button.textContent='Cancelling…';
    try{
      const response=await fetch(API_BASE+'/api/orders/'+encodeURIComponent(orderId)+'/cancel',{
        method:'POST',
        headers:{Authorization:'Bearer '+token}
      });
      const data=await response.json().catch(()=>({}));
      if(!response.ok) throw new Error(data.error||'Could not cancel this order.');
      message.textContent='Order cancelled successfully.';
      await loadOrders();
    }catch(error){
      message.textContent=error.message||'Could not cancel this order.';
      button.disabled=false;
      button.textContent='Cancel Order';
    }
  }
  async function loadOrders(isPoll){
    if(loading) return;
    if(!token){
      message.textContent='Please sign in to view your order history.';
      ordersEl.replaceChildren();
      const link=document.createElement('a');
      link.href='login.html';
      link.className='button primary';
      link.textContent='Sign In';
      link.style.display='block';
      link.style.width='fit-content';
      link.style.margin='14px auto';
      ordersEl.appendChild(link);
      return;
    }
    loading=true;
    refreshBtn.disabled=true;
    if(!isPoll) message.textContent='Loading your orders…';
    try{
      const response=await fetch(API_BASE+'/api/orders',{headers:{Authorization:'Bearer '+token}});
      const data=await response.json().catch(()=>({}));
      if(response.status===401||response.status===403){
        localStorage.removeItem('campusEatsToken');
        localStorage.removeItem('campusEatsCurrentUser');
        throw new Error('Your session has expired. Please sign in again.');
      }
      if(!response.ok) throw new Error(data.error||'Could not load your orders.');
      const orders=Array.isArray(data.orders)?data.orders:[];
      if(!firstSuccessfulLoad){
        orders.forEach(order=>{
          const current=String(order.status||'pending').toLowerCase();
          const previous=previousStatuses.get(order.id);
          if(previous && previous!==current) announceStatus(order,current);
        });
      }
      previousStatuses.clear();
      orders.forEach(order=>previousStatuses.set(order.id,String(order.status||'pending').toLowerCase()));
      firstSuccessfulLoad=false;
      renderOrders(orders);
      message.textContent=orders.length ? 'Showing your '+orders.length+' most recent order'+(orders.length===1?'':'s')+'. Statuses refresh automatically every 15 seconds while this page is open.' : 'Your order history is empty.';
    }catch(error){
      message.textContent=error.message||'Could not connect to Campus Eats. Please try again.';
    }finally{refreshBtn.disabled=false;loading=false;}
  }
  orderFilters.addEventListener('click', event => {
    const button = event.target.closest('[data-filter]');
    if (!button) return;
    activeFilter = button.dataset.filter;
    renderOrders(currentOrders);
  });
  refreshBtn.addEventListener('click',()=>loadOrders(false));
  loadOrders(false);
  setInterval(()=>loadOrders(true),15000);
})();
</script>

<script>
(function () {
  const accountLink = document.getElementById('accountNav');
  const logoutLink = document.getElementById('logoutNav');
  if (!accountLink || !logoutLink) return;
  const token = localStorage.getItem('campusEatsToken');
  const rawUser = localStorage.getItem('campusEatsCurrentUser');
  if (token && rawUser) {
    let user = {};
    try { user = JSON.parse(rawUser) || {}; } catch (_) {}
    const name = [user.first_name, user.firstName, user.name, user.full_name].find(value => typeof value === 'string' && value.trim());
    accountLink.textContent = name ? name.trim().split(/\\s+/)[0] : 'My Account';
    accountLink.href = 'my-orders.html';
    logoutLink.hidden = false;
  }
  logoutLink.addEventListener('click', function (event) {
    event.preventDefault();
    localStorage.removeItem('campusEatsToken');
    localStorage.removeItem('campusEatsCurrentUser');
    window.location.href = 'campuseats-menu.html';
  });
})();
</script>

</body>
</html>
