<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Dashboard — Campus Eats Staff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --hunter: #1F3823;
    --brick: #A8412C;
    --parchment: #EFE9DA;
    --gold: #C9A227;
    --ink: #2B2418;
    --white: #FFFFFF;
    --card-bg: #FFFFFF;
    --column-bg: rgba(43, 36, 24, 0.035);
    --danger: #A8412C;
    --ok: #3E6B44;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--parchment);
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  /* ---------- TOP BAR ---------- */

  .topbar {
    background: var(--hunter);
    border-bottom: 3px solid var(--gold);
    padding: 14px 22px;
    position: sticky;
    top: 0;
    z-index: 40;
  }

  .topbar-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand-badge {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 2px solid var(--white);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .brand-badge svg { width: 20px; height: 20px; }

  .brand-text {
    color: var(--white);
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 1px;
    text-transform: uppercase;
    line-height: 1.2;
  }

  .brand-text small {
    display: block;
    font-family: 'Work Sans', sans-serif;
    text-transform: none;
    font-weight: 500;
    font-size: 11px;
    color: var(--gold);
    letter-spacing: 0.3px;
  }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 18px;
  }

  .live-clock {
    color: var(--parchment);
    font-family: 'Oswald', sans-serif;
    font-size: 13px;
    letter-spacing: 0.5px;
    opacity: 0.85;
  }

  .sound-toggle {
    display: flex;
    align-items: center;
    gap: 7px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    color: var(--parchment);
    font-family: 'Oswald', sans-serif;
    font-size: 12px;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
  }

  .sound-toggle[data-on="true"] { border-color: var(--gold); color: var(--gold); }

  .btn-signout {
    background: var(--brick);
    color: var(--white);
    font-family: 'Oswald', sans-serif;
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    padding: 9px 16px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
  }

  .btn-signout:hover { background: #8f371f; }

  /* ---------- BOARD ---------- */

  .board-header {
    max-width: 1600px;
    margin: 0 auto;
    padding: 20px 22px 0;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }

  .board-header h1 {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 21px;
    letter-spacing: 0.3px;
  }

  .board-header .count-summary {
    font-size: 13px;
    color: var(--ink);
    opacity: 0.65;
  }

  .order-search {
    flex: 1 1 260px;
    max-width: 420px;
    min-width: 220px;
    padding: 10px 12px;
    border: 1px solid rgba(43, 36, 24, 0.22);
    border-radius: 8px;
    background: var(--white);
    color: var(--ink);
    font: inherit;
    font-size: 13px;
  }

  .order-search:focus {
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }

  .board {
    max-width: 1600px;
    margin: 0 auto;
    padding: 16px 22px 40px;
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: 300px;
    gap: 16px;
    overflow-x: auto;
    align-items: start;
  }

  .column {
    background: var(--column-bg);
    border: 1px solid rgba(43, 36, 24, 0.1);
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    max-height: calc(100vh - 150px);
    min-height: 200px;
  }

  .column-head {
    padding: 14px 14px 12px;
    border-bottom: 2px solid rgba(43, 36, 24, 0.1);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .column-head .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
    margin-right: 8px;
  }

  .column-title {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 13.5px;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    display: flex;
    align-items: center;
  }

  .column-count {
    background: var(--white);
    border: 1px solid rgba(43, 36, 24, 0.15);
    border-radius: 999px;
    font-family: 'Oswald', sans-serif;
    font-size: 12px;
    font-weight: 600;
    padding: 2px 9px;
    min-width: 22px;
    text-align: center;
  }

  .column-body {
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow-y: auto;
  }

  .column-empty {
    font-size: 12.5px;
    color: var(--ink);
    opacity: 0.4;
    text-align: center;
    padding: 18px 8px;
    font-style: italic;
  }

  /* column dot colors */
  .col-new .dot { background: var(--brick); }
  .col-accepted .dot { background: var(--gold); }
  .col-processing .dot { background: #7A6A2E; }
  .col-ready .dot { background: var(--hunter); }
  .col-delivering .dot { background: #3E6B44; }
  .col-completed .dot { background: #4A5A4C; opacity: 0.7; }
  .col-cancelled .dot { background: var(--ink); opacity: 0.4; }

  /* ---------- ORDER CARD ---------- */

  .card {
    background: var(--card-bg);
    border: 1px solid rgba(43, 36, 24, 0.12);
    border-radius: 12px;
    padding: 13px 14px 14px;
    box-shadow: 0 2px 6px rgba(43, 36, 24, 0.05);
  }

  .card.is-urgent {
    border-color: var(--brick);
    box-shadow: 0 0 0 2px rgba(168, 65, 44, 0.18);
  }

  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 8px;
  }

  .order-id {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.3px;
  }

  .order-total {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 14px;
    color: var(--brick);
    white-space: nowrap;
  }

  .timer-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--brick);
    color: var(--white);
    font-family: 'Oswald', sans-serif;
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0.4px;
    padding: 5px 9px;
    border-radius: 999px;
    margin-bottom: 10px;
  }

  .timer-pill svg { width: 12px; height: 12px; flex-shrink: 0; }

  .timer-pill.timer-warn {
    background: #c0392b;
    animation: pulse 1s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.65; }
  }

  .customer-line {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 2px;
  }

  .customer-phone {
    font-size: 12px;
    color: var(--ink);
    opacity: 0.65;
    margin-bottom: 9px;
  }

  .items-list {
    font-size: 12.5px;
    line-height: 1.55;
    margin-bottom: 9px;
    padding-left: 2px;
  }

  .items-list .item-row {
    display: flex;
    justify-content: space-between;
    gap: 6px;
  }

  .items-list .item-qty {
    color: var(--ink);
    opacity: 0.55;
    flex-shrink: 0;
  }

  .meta-grid {
    display: flex;
    flex-direction: column;
    gap: 5px;
    font-size: 12px;
    margin-bottom: 10px;
  }

  .meta-row {
    display: flex;
    gap: 6px;
    align-items: flex-start;
  }

  .meta-label {
    font-family: 'Oswald', sans-serif;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--ink);
    opacity: 0.45;
    flex-shrink: 0;
    width: 62px;
  }

  .meta-value { color: var(--ink); opacity: 0.85; }

  .payment-tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 999px;
  }

  .payment-tag.cash { background: rgba(62, 107, 68, 0.14); color: var(--ok); }
  .payment-tag.transfer { background: rgba(201, 162, 39, 0.18); color: #7A6A2E; }

  .note-box {
    background: rgba(201, 162, 39, 0.12);
    border-left: 3px solid var(--gold);
    padding: 6px 9px;
    font-size: 11.5px;
    line-height: 1.4;
    border-radius: 0 6px 6px 0;
    margin-bottom: 10px;
  }

  .photo-link {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11.5px;
    color: var(--hunter);
    font-weight: 600;
    margin-bottom: 10px;
    border-bottom: 1px dashed var(--hunter);
  }

  .card-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 4px;
  }

  .btn-action {
    flex: 1 1 auto;
    font-family: 'Oswald', sans-serif;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    padding: 9px 10px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    transition: filter 0.12s ease;
  }

  .btn-action:hover { filter: brightness(0.93); }

  .btn-primary { background: var(--hunter); color: var(--white); }
  .btn-danger { background: transparent; color: var(--brick); border: 1.5px solid var(--brick); }
  .btn-danger:hover { background: rgba(168, 65, 44, 0.08); }

  .status-note {
    font-size: 11.5px;
    color: var(--ink);
    opacity: 0.5;
    font-style: italic;
    margin-top: 4px;
  }

  .cancel-reason {
    font-size: 11.5px;
    color: var(--brick);
    font-weight: 600;
    margin-top: 2px;
  }

  /* ---------- RESPONSIVE ---------- */

  @media (max-width: 700px) {
    .board {
      grid-auto-flow: row;
      grid-auto-columns: unset;
      grid-template-columns: 1fr;
    }
    .column { max-height: none; }
    .column-body { max-height: 420px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-badge" aria-hidden="true">
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="32" cy="14" r="6" fill="#FFFFFF"/>
          <path d="M32 21 L27 34 L20 40" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none"/>
          <path d="M32 21 L38 32 L47 26" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none"/>
          <path d="M27 34 L23 50" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
          <path d="M32 34 L38 49" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
          <rect x="12" y="36" width="12" height="8" rx="1" fill="#FFFFFF"/>
          <rect x="13.5" y="34" width="9" height="2" fill="#FFFFFF"/>
          <path d="M43 22 a6 6 0 0 1 12 0 z" fill="#FFFFFF"/>
          <rect x="41.5" y="22" width="15" height="2.4" rx="1.2" fill="#FFFFFF"/>
          <rect x="47.5" y="15" width="2" height="4" fill="#FFFFFF"/>
        </svg>
      </span>
      <span class="brand-text">Campus Eats<small>Staff Portal — Tubatsi Grill House</small></span>
    </div>
    <div class="topbar-right">
      <span class="live-clock" id="live-clock">--:--:--</span>
      <button class="sound-toggle" id="sound-toggle" data-on="true" aria-pressed="true">🔔 Alerts On</button>
      <button class="btn-signout" id="signout-btn">Sign Out</button>
    </div>
  </div>
</header>

<div class="board-header">
  <h1>Order Dashboard</h1>
  <input
    class="order-search"
    id="order-search"
    type="search"
    placeholder="Search order ID, customer, building, or item…"
    aria-label="Search orders"
    autocomplete="off"
  >
  <span class="count-summary" id="count-summary" aria-live="polite"></span>
</div>

<main class="board" id="board">
  <!-- Columns are rendered by JS -->
</main>

<script>
  /* =====================================================
     CONFIG
     ===================================================== */
  const NEW_ORDER_WINDOW_SECONDS = 5 * 60; // 5-minute accept window
  const WARN_THRESHOLD_SECONDS = 60;       // last 60s pulses red

  const COLUMNS = [
  { key: 'pending',   label: 'New Orders', cls: 'col-new' },
  { key: 'accepted',  label: 'Accepted',   cls: 'col-accepted' },
  { key: 'delivered', label: 'Delivered',  cls: 'col-completed' },
  { key: 'cancelled', label: 'Cancelled',  cls: 'col-cancelled' },
];

  /* =====================================================
     MOCK DATA
     ===================================================== */

const API_BASE = 'https://campus-eats-test-api.onrender.com';
const staffToken = sessionStorage.getItem('campuseats_staff_token');

let orders = [];
let soundOn = true;
let orderSearchTerm = '';

async function apiRequest(path, options = {}) {
  const response = await fetch(`${API_BASE}${path}`, {
    ...options,
    headers: {
      'Content-Type': 'application/json',
      Authorization: `Bearer ${staffToken}`,
      ...(options.headers || {})
    }
  });

  const data = await response.json();

  if (!response.ok) {
    throw new Error(data.error || 'Request failed.');
  }

  return data;
}

function formatOrderId(id) {
  return `#${String(id).replace(/-/g, '').slice(0, 8).toUpperCase()}`;
}

async function loadOrders() {
  if (!staffToken) {
    window.location.href = 'staff-login.html';
    return;
  }

  try {
    const data = await apiRequest('/api/staff/orders');

    orders = data.orders.map(order => ({
      id: order.id,
      displayId: formatOrderId(order.id),
      customerName: order.customer_name || 'Customer',
      phone: order.customer_phone || '',
      items: (order.items || []).map(item => ({
        name: item.item_name,
        qty: item.quantity
      })),
      total: Number(order.total_cents) / 100,
      paymentMethod: order.payment_method,
      building: order.building_name || '',
      note: '',
      state: order.status,
      createdAt: new Date(order.created_at).getTime()
    }));

    render();
  } catch (error) {
    console.error('Could not load real orders:', error);
    alert(`Could not load orders: ${error.message}`);
  }
}

  /* =====================================================
     STATE MACHINE
     ===================================================== */
 
const TRANSITIONS = {
  pending:   { accept: 'accepted' },
  accepted:  { deliver_done: 'delivered' }
};


 
const ACTION_LABELS = {
  accept: 'Accept Order',
  deliver_done: 'Mark Delivered'
};


  function actionsFor(state) {
    const map = TRANSITIONS[state];
    if (!map) return [];
    return Object.keys(map).map((action) => ({
      action,
      label: ACTION_LABELS[action],
      danger: action === 'cancel',
    }));
  }

  
 
async function applyAction(orderId, action) {
  const order = orders.find(o => o.id === orderId);
  if (!order) return;

  const map = TRANSITIONS[order.state];
  if (!map || !map[action]) return;

  let endpoint;

  if (action === 'accept' && order.state === 'pending') {
    endpoint = `/api/staff/orders/${order.id}/accept`;
  } else if (action === 'deliver_done' && order.state === 'accepted') {
    endpoint = `/api/staff/orders/${order.id}/deliver`;
  } else {
    return;
  }

  try {
    await apiRequest(endpoint, { method: 'POST' });
    await loadOrders();
  } catch (error) {
    console.error('Order action failed:', error);
    alert(`Could not update order: ${error.message}`);
  }
}

  

  /* =====================================================
     RENDER HELPERS
     ===================================================== */
  const clockIcon = `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/>
    <path d="M12 7v5l3.5 2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </svg>`;

  function formatMoney(n) { return 'R' + n; }

  function formatMMSS(totalSeconds) {
    const s = Math.max(0, Math.ceil(totalSeconds));
    const m = Math.floor(s / 60);
    const r = s % 60;
    return m + ':' + String(r).padStart(2, '0');
  }

  function paymentTagHtml(method) {
    if (method === 'cash') return '<span class="payment-tag cash">Cash on delivery</span>';
    return '<span class="payment-tag transfer">Bank transfer</span>';
  }

  function itemsListHtml(items) {
    return items
      .map(
        (it) =>
          `<div class="item-row"><span>${it.name}</span><span class="item-qty">×${it.qty}</span></div>`
      )
      .join('');
  }

  function cardHtml(order) {
    const isNew = order.state === 'pending';
    let timerHtml = '';
    let urgentClass = '';

    if (isNew) {
      const elapsed = (Date.now() - order.createdAt) / 1000;
      const remaining = NEW_ORDER_WINDOW_SECONDS - elapsed;
      const warn = remaining <= WARN_THRESHOLD_SECONDS;
      if (warn) urgentClass = ' is-urgent';
      timerHtml = `<div class="timer-pill${warn ? ' timer-warn' : ''}" data-timer-for="${order.id}">
        ${clockIcon}<span data-timer-text>${formatMMSS(remaining)}</span> left to accept
      </div>`;
    }

    const actions = actionsFor(order.state);
    const actionsHtml = actions.length
      ? `<div class="card-actions">${actions
          .map(
            (a) =>
              `<button class="btn-action ${a.danger ? 'btn-danger' : 'btn-primary'}" data-order="${order.id}" data-action="${a.action}">${a.label}</button>`
          )
          .join('')}</div>`
      : '';

    let footerHtml = '';
    if (order.state === 'delivered') {
      footerHtml = '<div class="status-note">Delivered — order closed.</div>';
    } else if (order.state === 'cancelled') {
      footerHtml = `<div class="cancel-reason">${order.cancelReason || 'Cancelled'}</div>`;
    }

    return `
      <article class="card${urgentClass}" id="card-${order.id}">
        ${timerHtml}
        <div class="card-top">
          <span class="order-id">${order.displayId || order.id}</span>
          <span class="order-total">${formatMoney(order.total)}</span>
        </div>
        <div class="customer-line">${order.customerName}</div>
        <div class="customer-phone">${order.phone}</div>
        <div class="items-list">${itemsListHtml(order.items)}</div>
        <div class="meta-grid">
          <div class="meta-row"><span class="meta-label">Payment</span><span class="meta-value">${paymentTagHtml(order.paymentMethod)}</span></div>
          <div class="meta-row"><span class="meta-label">Building</span><span class="meta-value">${order.building}</span></div>
        </div>
        ${order.note ? `<div class="note-box">${order.note}</div>` : ''}
      
        ${actionsHtml}
        ${footerHtml}
      </article>
    `;
  }

  function orderMatchesSearch(order) {
    if (!orderSearchTerm) return true;

    const searchableText = [
      order.displayId,
      order.id,
      order.customerName,
      order.phone,
      order.building,
      ...order.items.map((item) => item.name)
    ].join(' ').toLowerCase();

    return searchableText.includes(orderSearchTerm);
  }

  function columnHtml(col) {
    const colOrders = orders
      .filter((o) => o.state === col.key && orderMatchesSearch(o))
      .sort((a, b) => a.createdAt - b.createdAt);

    const body = colOrders.length
      ? colOrders.map(cardHtml).join('')
      : `<div class="column-empty">${orderSearchTerm ? 'No matching orders' : 'No orders here right now'}</div>`;

    return `
      <section class="column ${col.cls}">
        <div class="column-head">
          <span class="column-title"><span class="dot"></span>${col.label}</span>
          <span class="column-count">${colOrders.length}</span>
        </div>
        <div class="column-body">${body}</div>
      </section>
    `;
  }

  function render() {
    const board = document.getElementById('board');
    board.innerHTML = COLUMNS.map(columnHtml).join('');

    const active = orders.filter((o) => o.state !== 'delivered' && o.state !== 'cancelled').length;
    const matching = orders.filter(orderMatchesSearch).length;
    document.getElementById('count-summary').textContent = orderSearchTerm
      ? `${matching} matching order${matching === 1 ? '' : 's'} · ${active} active total`
      : `${active} active order${active === 1 ? '' : 's'}`;

    board.querySelectorAll('[data-action]').forEach((btn) => {
      btn.addEventListener('click', () => {
        applyAction(btn.getAttribute('data-order'), btn.getAttribute('data-action'));
      });
    });
  }

  /* =====================================================
     TIMER TICK — updates countdown text without a full
     re-render, then triggers a full render on expiry
     ===================================================== */
  function tick() {
    
    orders.forEach((order) => {
     if (order.state !== 'pending') return;
      const elapsed = (Date.now() - order.createdAt) / 1000;
      const remaining = NEW_ORDER_WINDOW_SECONDS - elapsed;
     if (remaining <= 0) {
  const el = document.querySelector(
    `[data-timer-for="${order.id}"] [data-timer-text]`
  );
  if (el) el.textContent = '00:00';
  return;
}
      const el = document.querySelector(`[data-timer-for="${order.id}"] [data-timer-text]`);
      if (el) el.textContent = formatMMSS(remaining);
      const pill = document.querySelector(`[data-timer-for="${order.id}"]`);
      if (pill && remaining <= WARN_THRESHOLD_SECONDS) {
        pill.classList.add('timer-warn');
        document.getElementById(`card-${order.id}`)?.classList.add('is-urgent');
      }
    });
   
 
  document.getElementById('live-clock').textContent = new Date().toLocaleTimeString('en-ZA', { hour12: false });
  }
